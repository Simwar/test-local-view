$kind: http-request
name: Feed Pet
method: POST
url: '{{baseUrl}}/api/pets/{{petId}}/feed'
description: 'Feed a pet with a specified food'
order: 1000
pathVariables:
  - key: petId
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "food": "salmon treats"
    }
