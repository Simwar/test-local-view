$kind: http-request
name: Add Pet
method: POST
url: '{{baseUrl}}/api/pets'
description: 'Add a new pet to the cafe'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Luna",
      "type": "cat",
      "age": 2,
      "color": "black",
      "favoriteActivity": "napping"
    }
